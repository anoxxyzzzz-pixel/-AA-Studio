name: Build TikTok Live Overlay APK

on:
  push:
    paths:
      - 'tiktok-live-overlay/**'
      - '.github/workflows/build-tiktok-live-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiktok-live-overlay
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tiktok-live-overlay/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          test -s www/index.html
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Live-Overlay-APK
          path: tiktok-live-overlay/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="tiktok-live-overlay/android/app/build/outputs/apk/debug/app-debug.apk"
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title "TikTok Live Overlay v1.0.0" --notes "Build otomatis dari GitHub Actions. APK debug untuk pengujian Android."
          gh release upload v1.0.0 "$APK" --clobber
