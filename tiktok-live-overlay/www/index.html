<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Live Comment Overlay</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tiktok-live-connector@latest/browser/index.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{background-color:rgba(10,10,12,.95);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;margin:0;padding:0;overflow-x:hidden}
body.transparent-mode{background-color:transparent!important}
#chat-container::-webkit-scrollbar{width:4px}#chat-container::-webkit-scrollbar-thumb{background:rgba(254,44,85,.4);border-radius:4px}
@keyframes slideIn{0%{opacity:0;transform:translateY(18px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
.chat-bubble{animation:slideIn .25s cubic-bezier(.25,1,.5,1) forwards;background:rgba(20,20,26,.88);backdrop-filter:blur(8px);border-left:4px solid #fe2c55;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.gift-bubble{animation:slideIn .3s cubic-bezier(.25,1,.5,1) forwards;background:linear-gradient(135deg,rgba(254,44,85,.25),rgba(37,244,238,.2));backdrop-filter:blur(8px);border-left:4px solid #25f4ee;box-shadow:0 4px 15px rgba(254,44,85,.3)}
#control-panel{transition:all .3s ease}
</style>
</head>
<body class="min-h-screen flex flex-col p-3 md:p-6">
<div id="control-panel" class="w-full max-w-md mx-auto mb-4 bg-gray-900/90 border border-gray-800 rounded-2xl p-4 shadow-2xl backdrop-blur-md">
<div class="flex items-center justify-between mb-3"><div class="flex items-center space-x-2"><i class="fa-brands fa-tiktok text-xl text-[#fe2c55]"></i><h1 class="font-bold text-sm tracking-wide uppercase text-gray-200">Live Overlay Control</h1></div><button id="toggle-panel-btn" class="text-xs text-gray-400 hover:text-white transition"><i class="fa-solid fa-eye-slash mr-1"></i>Sembunyikan</button></div>
<div class="space-y-3"><div><label for="username-input" class="block text-xs text-gray-400 mb-1 font-medium">Username TikTok Live</label><div class="relative"><span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 text-sm font-semibold">@</span><input type="text" id="username-input" value="reza_arapp25" class="w-full pl-8 pr-3 py-2 bg-gray-800 border border-gray-700 rounded-xl text-sm font-medium focus:outline-none focus:border-[#fe2c55] focus:ring-1 focus:ring-[#fe2c55] transition text-white" placeholder="username_tiktok"></div></div>
<div class="grid grid-cols-2 gap-2"><button id="connect-btn" class="w-full bg-[#fe2c55] hover:bg-[#e02649] text-white font-semibold py-2 px-3 rounded-xl text-xs flex items-center justify-center space-x-2 transition shadow-lg shadow-[#fe2c55]/20 active:scale-95"><i class="fa-solid fa-plug"></i><span id="connect-btn-text">Hubungkan</span></button><button id="test-btn" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold py-2 px-3 rounded-xl text-xs flex items-center justify-center space-x-2 transition border border-gray-700 active:scale-95"><i class="fa-solid fa-flask text-[#25f4ee]"></i><span>Test Chat</span></button></div></div></div>
<button id="show-panel-btn" class="hidden fixed top-3 right-3 bg-gray-900/80 text-gray-300 hover:text-white p-2 rounded-full shadow-lg border border-gray-700 z-50"><i class="fa-solid fa-gear"></i></button>
<div class="w-full max-w-md mx-auto mb-2 flex items-center justify-between px-1"><div class="flex items-center space-x-2 bg-black/60 px-3 py-1.5 rounded-full border border-gray-800/80 text-xs backdrop-blur-md"><span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-500 animate-pulse"></span><span id="status-text" class="font-medium text-gray-300">Terputus</span></div><button id="toggle-bg-btn" class="text-xs text-gray-400 bg-black/40 hover:bg-black/80 px-2.5 py-1 rounded-full border border-gray-800 transition"><i class="fa-solid fa-wand-magic-sparkles mr-1 text-[#25f4ee]"></i> Mode Overlay</button></div>
<main class="w-full max-w-md mx-auto flex-1 flex flex-col justify-end overflow-hidden"><div id="chat-container" class="space-y-2.5 overflow-y-auto max-h-[75vh] p-1 pr-2"><div class="chat-bubble p-3 rounded-2xl flex items-start space-x-3"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=System" class="w-9 h-9 rounded-full object-cover bg-gray-800 flex-shrink-0 border border-gray-700" alt="Bot Avatar"><div class="flex-1 min-w-0"><div class="flex items-center space-x-1.5"><span class="font-bold text-xs text-[#fe2c55] truncate">System Bot</span><span class="bg-[#fe2c55]/20 text-[#fe2c55] text-[10px] px-1.5 py-0.5 rounded-md font-semibold">INFO</span></div><p class="text-xs text-gray-200 mt-1 leading-relaxed">Siap terhubung! Masukkan username TikTok & tekan <b class="text-white">Hubungkan</b> atau gunakan tombol <b class="text-[#25f4ee]">Test Chat</b>.</p></div></div></div></main>
<script>
const usernameInput=document.getElementById('username-input'),connectBtn=document.getElementById('connect-btn'),connectBtnText=document.getElementById('connect-btn-text'),testBtn=document.getElementById('test-btn'),chatContainer=document.getElementById('chat-container'),statusDot=document.getElementById('status-dot'),statusText=document.getElementById('status-text'),controlPanel=document.getElementById('control-panel'),togglePanelBtn=document.getElementById('toggle-panel-btn'),showPanelBtn=document.getElementById('show-panel-btn'),toggleBgBtn=document.getElementById('toggle-bg-btn');
let tiktokConnection=null,isConnected=false;
const testMessages=[{user:"Budi_Gamer99",msg:"Halo bang! Semangat live streamingnya 🔥",gift:false},{user:"Siti_Rahma",msg:"Lagi main game apa nih bang?",gift:false},{user:"TikTokViewer_1",msg:"Mengirim Rose x5! 🌹",gift:true},{user:"RizkyPlayz",msg:"Mantap overlaynya rapi banget bang! 👍",gift:false},{user:"DonaturSultan",msg:"Mengirim Topi x1! 🧢",gift:true}];
function escapeHtml(text){if(!text)return"";return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function appendComment(username,message,avatarUrl,isGift=false){const bubble=document.createElement('div');bubble.className=(isGift?'gift-bubble':'chat-bubble')+' p-3 rounded-2xl flex items-start space-x-3';const avatar=avatarUrl&&avatarUrl.length>5?avatarUrl:'https://api.dicebear.com/7.x/avataaars/svg?seed='+encodeURIComponent(username);bubble.innerHTML='<img src="'+avatar+'" onerror="this.src=\'https://api.dicebear.com/7.x/avataaars/svg?seed=fallback\'" class="w-9 h-9 rounded-full object-cover bg-gray-800 flex-shrink-0 border border-gray-700/60 shadow-sm" alt="Avatar"><div class="flex-1 min-w-0"><div class="flex items-center justify-between"><span class="font-bold text-xs '+(isGift?'text-[#25f4ee]':'text-[#fe2c55]')+' truncate">'+escapeHtml(username)+'</span>'+(isGift?'<span class="text-[10px] font-bold text-[#25f4ee] bg-[#25f4ee]/10 px-1.5 py-0.5 rounded">GIFT 🎁</span>':'')+'</div><p class="text-xs text-gray-100 mt-0.5 break-words leading-relaxed">'+escapeHtml(message)+'</p></div>';chatContainer.appendChild(bubble);if(chatContainer.children.length>25)chatContainer.removeChild(chatContainer.firstChild);chatContainer.scrollTop=chatContainer.scrollHeight}
function updateStatus(state,message){if(state==='connecting'){statusDot.className='w-2.5 h-2.5 rounded-full bg-yellow-400 animate-ping';statusText.innerText=message||'Menghubungkan...';statusText.className='font-medium text-yellow-400'}else if(state==='connected'){statusDot.className='w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';statusText.innerText=message||'Terhubung';statusText.className='font-medium text-emerald-400'}else{statusDot.className='w-2.5 h-2.5 rounded-full bg-rose-500';statusText.innerText=message||'Terputus';statusText.className='font-medium text-gray-400'}}
function connectTikTok(){const username=usernameInput.value.trim().replace('@','');if(!username){alert('Silakan masukkan username TikTok yang valid!');return}if(isConnected&&tiktokConnection){try{tiktokConnection.disconnect()}catch(e){}isConnected=false;connectBtnText.innerText='Hubungkan';updateStatus('disconnected','Terputus');appendComment('System','Koneksi ke @'+username+' telah dihentikan.');return}updateStatus('connecting','Menghubungkan ke @'+username+'...');connectBtnText.innerText='Batal';if(typeof TikTokLiveConnection==='undefined'){updateStatus('disconnected','Gagal (Library Error)');appendComment('System Error','Library TikTokLiveConnection belum terisi atau terblokir jaringan.');connectBtnText.innerText='Hubungkan';return}try{tiktokConnection=new TikTokLiveConnection(username);tiktokConnection.connect().then(state=>{isConnected=true;connectBtnText.innerText='Putuskan';updateStatus('connected','Terhubung: @'+username);appendComment('System','Berhasil terhubung ke Live @'+username+'! Room ID: '+state.roomId)}).catch(err=>{isConnected=false;connectBtnText.innerText='Hubungkan';updateStatus('disconnected','Gagal Terhubung');appendComment('System Error','Gagal terhubung ke @'+username+'. Pastikan akun SEDANG LIVE!');console.error(err)});tiktokConnection.on('chat',data=>appendComment(data.uniqueId,data.comment,data.profilePictureUrl));tiktokConnection.on('gift',data=>{if(data.giftType===1||!data.repeatEnd)appendComment(data.uniqueId,'Mengirim '+data.giftName+' x'+data.repeatCount+'! 🎁',data.profilePictureUrl,true)});tiktokConnection.on('streamEnd',()=>{updateStatus('disconnected','Live Berakhir');appendComment('System','Siaran langsung telah berakhir.');connectBtnText.innerText='Hubungkan';isConnected=false})}catch(err){updateStatus('disconnected','Error Sistem');appendComment('System Error','Error: '+err.message);connectBtnText.innerText='Hubungkan'}}
connectBtn.addEventListener('click',connectTikTok);
testBtn.addEventListener('click',()=>{const m=testMessages[Math.floor(Math.random()*testMessages.length)];appendComment(m.user,m.msg,'',m.gift)});
togglePanelBtn.addEventListener('click',()=>{controlPanel.classList.add('hidden');showPanelBtn.classList.remove('hidden')});
showPanelBtn.addEventListener('click',()=>{controlPanel.classList.remove('hidden');showPanelBtn.classList.add('hidden')});
toggleBgBtn.addEventListener('click',()=>{document.body.classList.toggle('transparent-mode');const t=document.body.classList.contains('transparent-mode');toggleBgBtn.innerHTML=t?'<i class="fa-solid fa-image mr-1"></i> Mode Normal':'<i class="fa-solid fa-wand-magic-sparkles mr-1 text-[#25f4ee]"></i> Mode Overlay'});
window.addEventListener('DOMContentLoaded',()=>{const u=new URLSearchParams(location.search).get('username');if(u)usernameInput.value=u});
</script>
</body></html>
